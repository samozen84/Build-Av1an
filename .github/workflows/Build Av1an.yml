name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone official Av1an repository
        uses: actions/checkout@v4
        with:
          repository: rust-av/Av1an
          path: src

      - name: Install System Dependencies (Windows)
        run: |
          # Install only ffmpeg, which works perfectly out-of-the-box on Chocolatey
          choco install ffmpeg -y

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        working-directory: ./src
        # Targeting the sub-package '-p av1an' isolates the compilation feature switches cleanly
        run: cargo build --release -p av1an --no-default-features --features "ffmpeg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: src/target/release/av1an.exe
          if-no-files-found: error
