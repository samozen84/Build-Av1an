name: Build Av1an

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Add the multimedia PPA to secure the missing libvapoursynth-dev package
          sudo add-apt-repository ppa:savoury1/multimedia -y
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pkg-config libvapoursynth-dev

      - name: Install System Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install ffmpeg vapoursynth pkg-config

      - name: Install System Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install ffmpeg
          # Fetch official portable components to extract the required linking SDK libraries
          curl -L -o vapoursynth.zip https://github.com
          7z x vapoursynth.zip -ovapoursynth

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --release

      - name: Build Av1an (macOS)
        if: matrix.os == 'macos-latest'
        env:
          PKG_CONFIG_PATH: "/opt/homebrew/lib/pkgconfig"
        run: cargo build --release

      - name: Build Av1an (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VAPOURSYNTH_LIB_DIR: ${{ github.workspace }}/vapoursynth/sdk/lib64
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-${{ matrix.os }}
          path: |
            target/release/av1an
            target/release/av1an.exe
          if-no-files-found: ignore
