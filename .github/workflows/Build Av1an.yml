name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone official Av1an repository
        uses: actions/checkout@v4
        with:
          repository: rust-av/Av1an
          path: src

      - name: Install System Dependencies (Windows)
        run: |
          choco install ffmpeg -y
          winget install VapourSynth.VapourSynth --silent --accept-package-agreements --accept-source-agreements

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        working-directory: ./src
        env:
          VAPOURSYNTH_LIB_DIR: C:\Program Files\VapourSynth\sdk\lib64
        run: cargo build --release

      # Fix: This step guarantees you will ALWAYS have an exe artifact on the summary dashboard
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: src/target/release/av1an.exe
          if-no-files-found: error

      # This step handles creating an official GitHub Release only when a tag is pushed
      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/target/release/av1an.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
