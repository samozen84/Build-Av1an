name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone official Av1an repository
        uses: actions/checkout@v4
        with:
          repository: rust-av/Av1an
          path: src

      - name: Install System Dependencies (Windows)
        run: |
          choco install ffmpeg -y
          # Download official VapourSynth installer silently to provide the SDK components natively
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com' -OutFile 'vs_installer.exe'"
          ./vs_installer.exe /S
          
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        working-directory: ./src
        env:
          # Point the compiler directly to the newly installed native Windows system directory
          VAPOURSYNTH_LIB_DIR: C:\Program Files\VapourSynth\sdk\lib64
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: src/target/release/av1an.exe
          if-no-files-found: error
