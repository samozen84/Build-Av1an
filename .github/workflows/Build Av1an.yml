name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Windows)
        shell: powershell
        run: |
          choco install ffmpeg -y
          # Use native PowerShell to safely download and extract the VapourSynth SDK components
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri "https://github.com" -OutFile "vapoursynth.zip"
          Expand-Archive -Path "vapoursynth.zip" -DestinationPath "$env:GITHUB_WORKSPACE\vapoursynth"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        shell: powershell
        env:
          VAPOURSYNTH_LIB_DIR: ${{ github.workspace }}\vapoursynth\sdk\lib64
        run: cargo build --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: target/release/av1an.exe
          if-no-files-found: error
