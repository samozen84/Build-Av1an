name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Windows)
        run: |
          choco install ffmpeg -y

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        # Bypasses default feature flags to isolate and compile only using ffmpeg
        run: cargo build --release --no-default-features --features "ffmpeg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: target/release/av1an.exe
          if-no-files-found: error
