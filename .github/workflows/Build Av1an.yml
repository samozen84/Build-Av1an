name: Build Av1an (Windows Only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone official Av1an repository
        # Clones into a clean 'src' subdirectory to avoid conflicts
        run: |
          git clone https://github.com src

      - name: Install System Dependencies (Windows)
        run: |
          choco install ffmpeg -y

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Av1an (Windows)
        # Changes directory to 'src' before initiating compile sequence
        working-directory: ./src
        run: cargo build --release --no-default-features --features "ffmpeg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: av1an-windows
          path: src/target/release/av1an.exe
          if-no-files-found: error
